<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor de Sesiones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
    :root {
        --bg: #0a0710;
        --bg-2: #150a20;
        --surface: rgba(26, 15, 38, 0.55);
        --surface-strong: rgba(26, 15, 38, 0.82);
        --border: rgba(255, 255, 255, 0.08);
        --accent: #ff2e88;
        --accent-2: #7c3aed;
        --accent-cyan: #00e0ff;
        --warm: #ffb74a;
        --text: #f5eefb;
        --text-secondary: #9c8fb5;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
    }

    html, body {
        background-color: var(--bg);
        color: var(--text);
    }

    body {
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* ---------- Sidebar / tracklist ---------- */

    .sidebar {
        width: 320px;
        background-color: rgba(6, 3, 10, 0.9);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        z-index: 2;
    }

    .sidebar-header {
        padding: 26px 22px 18px 22px;
        border-bottom: 1px solid var(--border);
    }

    .sidebar-header .kicker {
        font-size: 0.72rem;
        color: var(--text-secondary);
        letter-spacing: 0.02em;
    }

    .sidebar-header h1 {
        font-family: "Unbounded", "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        margin-top: 4px;
        line-height: 1.3;
    }

    .tracklist {
        list-style: none;
        overflow-y: auto;
        flex: 1;
        padding: 8px 10px;
    }

    .tracklist::-webkit-scrollbar {
        width: 6px;
    }
    .tracklist::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
    }

    .tracklist li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 12px;
        margin-bottom: 2px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--text-secondary);
        font-size: 0.9rem;
        transition: background 0.15s, color 0.15s;
    }

    .tracklist li:hover {
        background-color: rgba(255, 255, 255, 0.05);
        color: var(--text);
    }

    .tracklist li.active {
        background: linear-gradient(90deg, rgba(255, 46, 136, 0.18), rgba(124, 58, 237, 0.1));
        color: var(--text);
    }

    .track-num {
        font-variant-numeric: tabular-nums;
        font-size: 0.78rem;
        color: var(--text-secondary);
        width: 20px;
        flex-shrink: 0;
    }

    .tracklist li.active .track-num {
        color: var(--accent);
    }

    .track-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ---------- Main stage ---------- */

    .main-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        position: relative;
        overflow: hidden;
    }

    .ambient-bg {
        position: absolute;
        inset: -20%;
        background:
            radial-gradient(circle at 30% 25%, rgba(255, 46, 136, 0.22), transparent 45%),
            radial-gradient(circle at 75% 70%, rgba(124, 58, 237, 0.24), transparent 50%),
            radial-gradient(circle at 50% 100%, rgba(0, 224, 255, 0.08), transparent 55%);
        filter: blur(70px);
        z-index: 0;
        animation: driftGlow 14s ease-in-out infinite alternate;
        pointer-events: none;
    }

    @keyframes driftGlow {
        0%   { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.15) translate(3%, -3%); }
    }

    @media (prefers-reduced-motion: reduce) {
        .ambient-bg { animation: none; }
    }

    .stage {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 460px;
        text-align: center;
    }

    /* ---------- Art + visualizer ring ---------- */

    .art-stage {
        position: relative;
        width: 260px;
        height: 260px;
        margin: 0 auto 28px auto;
    }

    #ring-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .album-art-container {
        position: absolute;
        top: 25px;
        left: 25px;
        width: 210px;
        height: 210px;
        border-radius: 18px;
        overflow: hidden;
        background-color: #161022;
        box-shadow: 0 0 0 1px var(--border), 0 20px 45px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: box-shadow 0.2s;
    }

    .album-art-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: none;
    }

    .album-art-placeholder {
        font-size: 3.6rem;
        color: var(--text-secondary);
    }

    /* ---------- Song info ---------- */

    .song-info {
        margin-bottom: 26px;
        overflow: hidden;
    }

    .marquee-container {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
    }

    .song-title {
        font-family: "Unbounded", "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        display: inline-block;
    }

    .song-title.marquee {
        padding-left: 100%;
        animation: marqueeAnim 13s linear infinite;
    }

    @keyframes marqueeAnim {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-100%, 0); }
    }

    .song-artist {
        color: var(--text-secondary);
        font-size: 0.92rem;
        margin-top: 6px;
    }

    /* ---------- Progress ---------- */

    .progress-container {
        width: 100%;
        background-color: rgba(255, 255, 255, 0.08);
        height: 6px;
        border-radius: 3px;
        cursor: pointer;
        margin-bottom: 8px;
        position: relative;
        overflow: visible;
        transition: height 0.15s;
    }

    .progress-container:hover {
        height: 8px;
    }

    .progress-bar {
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        height: 100%;
        width: 0%;
        border-radius: 3px;
        position: relative;
    }

    .progress-bar::after {
        content: '';
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%) scale(0);
        width: 12px;
        height: 12px;
        background-color: #fff;
        border-radius: 50%;
        transition: transform 0.15s;
        box-shadow: 0 0 8px rgba(255, 46, 136, 0.7);
    }

    .progress-container:hover .progress-bar::after,
    .progress-container.dragging .progress-bar::after {
        transform: translateY(-50%) scale(1);
    }

    .time-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.74rem;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        margin-bottom: 26px;
    }

    /* ---------- Controls ---------- */

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 28px;
        margin-bottom: 26px;
    }

    .btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 1.3rem;
        transition: color 0.15s, transform 0.15s;
    }

    .btn:hover {
        color: var(--text);
        transform: scale(1.1);
    }

    .btn:focus-visible, button:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent-cyan);
        outline-offset: 3px;
    }

    .btn-play {
        background: var(--warm);
        color: #1a0f00;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        box-shadow: 0 8px 24px rgba(255, 183, 74, 0.35);
        transition: transform 0.15s, box-shadow 0.15s;
        cursor: pointer;
        border: none;
    }

    .btn-play:hover {
        transform: scale(1.06);
        box-shadow: 0 10px 30px rgba(255, 183, 74, 0.5);
    }

    /* ---------- Footer row: volumen + sync juguete ---------- */

    .footer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .volume-container {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .volume-container .btn {
        font-size: 1rem;
    }

    .volume-slider {
        width: 80px;
        height: 4px;
        accent-color: var(--accent);
        cursor: pointer;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
    }

    .toy-sync {
        display: flex;
        align-items: center;
        gap: 9px;
        position: relative;
    }

    .toy-sync-label {
        font-size: 0.78rem;
        color: var(--text-secondary);
        white-space: nowrap;
    }

    .toy-level {
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
        color: var(--accent-cyan);
        min-width: 30px;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .toy-level.visible {
        opacity: 1;
    }

    .toy-switch {
        width: 38px;
        height: 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid var(--border);
        cursor: pointer;
        position: relative;
        transition: background 0.2s;
        flex-shrink: 0;
    }

    .toy-switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--text-secondary);
        transition: transform 0.2s, background 0.2s;
    }

    .toy-switch.on {
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        border-color: transparent;
    }

    .toy-switch.on::after {
        transform: translateX(16px);
        background: #fff;
    }

    .toy-switch:disabled {
        opacity: 0.55;
        cursor: wait;
    }

    .toy-help-btn {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 0.68rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: color 0.15s, background 0.15s;
    }

    .toy-help-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.15);
    }

    .toy-note a {
        color: var(--accent-cyan);
        text-decoration: underline;
    }

    .toy-note {
        position: absolute;
        bottom: calc(100% + 10px);
        right: 0;
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.76rem;
        color: var(--text-secondary);
        width: 260px;
        text-align: left;
        line-height: 1.4;
        display: none;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .toy-note.visible {
        display: block;
    }

    @media (max-width: 768px) {
        body {
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar {
            width: 100%;
            max-height: 170px;
            border-right: none;
            border-bottom: 1px solid var(--border);
        }
        .main-container {
            flex: 1;
            padding: 24px 20px;
            justify-content: flex-start;
        }
    }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="kicker">Cloudflare R2</div>
        <h1>Tus sesiones</h1>
    </div>
    <ul id="playlist" class="tracklist"></ul>
</div>

<div class="main-container">
    <div class="ambient-bg"></div>

    <div class="stage">

        <div class="art-stage">
            <canvas id="ring-canvas" width="260" height="260"></canvas>
            <div id="art-container" class="album-art-container">
                <i id="art-placeholder" class="fa-solid fa-compact-disc album-art-placeholder"></i>
                <img id="album-art" alt="Carátula">
            </div>
        </div>

        <div class="song-info">
            <div class="marquee-container">
                <div id="song-title" class="song-title">Cargando música...</div>
            </div>
            <div id="song-artist" class="song-artist">&nbsp;</div>
        </div>

        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="time-info">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="prev-btn" class="btn" title="Anterior"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play-btn" class="btn-play" title="Reproducir/Pausar"><i class="fa-solid fa-play" id="play-icon"></i></button>
            <button id="next-btn" class="btn" title="Siguiente"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <div class="footer-row">
            <div class="volume-container">
                <button id="mute-btn" class="btn" title="Silenciar"><i class="fa-solid fa-volume-high" id="volume-icon"></i></button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>

            <div class="toy-sync">
                <span class="toy-sync-label">Sincronizar juguete</span>
                <span id="toy-level" class="toy-level"></span>
                <button id="toy-help" class="toy-help-btn" type="button" title="¿Qué necesito para esto?" aria-label="Ayuda sobre sincronizar juguete">?</button>
                <button id="toy-switch" class="toy-switch" role="switch" aria-checked="false" title="Sincronizar juguete al ritmo"></button>
                <div id="toy-note" class="toy-note">Pulsa el interruptor para generar un código QR y sincronizar tu juguete Lovense — nada que instalar.</div>
            </div>
        </div>

    </div>
</div>

<audio id="audio-element"></audio>

<script>
    // ---------------------------------------------------------------
    // Motor de audio compartido: un único AnalyserNode que alimenta
    // tanto el visualizador en anillo como (más adelante) la
    // sincronización del juguete. Cualquier otra parte de la interfaz
    // puede suscribirse con AudioEngine.subscribe(fn) sin duplicar el
    // grafo de Web Audio.
    // ---------------------------------------------------------------
    const AudioEngine = (() => {
        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let listeners = [];
        let rafId = null;
        let failed = false;
        let failListener = () => {};
        let mediaEl = null;

        function ensureContext(audioElement) {
            mediaEl = audioElement;
            if (audioCtx || failed) { console.log('AudioEngine[debug]: ya estaba inicializado (o falló antes), no reintento'); return; }
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) { failed = true; console.log('AudioEngine[debug]: este navegador no expone AudioContext'); failListener('no-web-audio'); return; }

            console.log('AudioEngine[debug]: creando AudioContext…');
            try {
                const ctx = new Ctx();
                console.log('AudioEngine[debug]: AudioContext creado, estado =', ctx.state, 'sampleRate =', ctx.sampleRate);
                const source = ctx.createMediaElementSource(audioElement);
                console.log('AudioEngine[debug]: MediaElementSource creado');
                const an = ctx.createAnalyser();
                an.fftSize = 256;
                an.smoothingTimeConstant = 0.75;
                source.connect(an);
                an.connect(ctx.destination);
                console.log('AudioEngine[debug]: analizador conectado, arrancando el bucle de lectura');

                audioCtx = ctx;
                analyser = an;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                loop();
            } catch (err) {
                console.error('AudioEngine: no se pudo montar el analizador de audio:', err);
                audioCtx = null;
                analyser = null;
                failed = true; // no reintentar en bucle; ya avisamos una vez
                failListener('setup-error', err);
            }
        }

        function resume() {
            if (audioCtx && audioCtx.state === 'suspended') {
                console.log('AudioEngine[debug]: contexto suspendido, llamando a resume()');
                audioCtx.resume().then(() => console.log('AudioEngine[debug]: resume() OK, estado =', audioCtx.state));
            }
        }

        let debugCounter = 0;
        function loop() {
            rafId = requestAnimationFrame(loop);
            if (!analyser) return;

            // Con la música en pausa no hay audio nuevo que analizar: no
            // llamamos a los suscriptores (visualizador, sincronización de
            // juguete) para que no se queden repitiendo el último valor.
            if (mediaEl && mediaEl.paused) return;

            analyser.getByteFrequencyData(dataArray);
            if (debugCounter++ % 120 === 0) { // ~cada 2 segundos a 60fps
                const max = Math.max(...dataArray);
                console.log('AudioEngine[debug]: contextState =', audioCtx.state, '| pico de frecuencia =', max, '| suscriptores =', listeners.length);
            }
            listeners.forEach(fn => fn(dataArray));
        }

        function subscribe(fn) {
            listeners.push(fn);
            return () => { listeners = listeners.filter(l => l !== fn); };
        }

        function onFail(fn) { failListener = fn; }

        return { ensureContext, resume, subscribe, onFail };
    })();

    // ---------------------------------------------------------------
    // ToySync: sincroniza un juguete Lovense usando la "Server API" de
    // Lovense. Nuestro servidor pide el código QR y recibe el aviso de
    // "ya escaneado" (necesita el token secreto), y también reenvía cada
    // comando de vibración — el navegador nunca habla directo con la app
    // local del móvil, porque esa vía choca con CORS. Todo pasa por
    // /api/lovense/*, servidor-a-servidor con Lovense.
    // ---------------------------------------------------------------
    const ToySync = (() => {
        const SEND_INTERVAL_MS = 500; // ritmo de envío al servidor (dos saltos de red: Render → Lovense)
        const BASS_BINS = 8;          // graves = primeros bins del análisis de frecuencia
        const VIBRATE_MAX = 20;       // escala de intensidad de Lovense: 0-20
        const POLL_INTERVAL_MS = 2000;
        const POLL_TIMEOUT_MS = 3 * 60 * 1000; // 3 minutos para escanear el QR

        let connected = false;
        let currentUid = null;
        let pollTimer = null;
        let unsubscribeAudio = null;
        let lastSent = 0;
        let statusListener = () => {};
        let levelListener = () => {};

        async function requestQR() {
            const res = await fetch('/api/lovense/qr', { method: 'POST' });
            if (!res.ok) {
                const msg = await res.text().catch(() => '');
                throw new Error(msg || 'No se pudo pedir el código QR.');
            }
            return res.json(); // { uid, qr }
        }

        function pollStatus(uid) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                pollTimer = setInterval(async () => {
                    if (Date.now() - start > POLL_TIMEOUT_MS) {
                        clearInterval(pollTimer);
                        reject(new Error('Se agotó el tiempo esperando el escaneo del código QR.'));
                        return;
                    }
                    try {
                        const res = await fetch(`/api/lovense/status?uid=${encodeURIComponent(uid)}`);
                        if (res.status === 204) return; // todavía no ha escaneado
                        if (!res.ok) return;
                        const data = await res.json();
                        clearInterval(pollTimer);
                        resolve(data);
                    } catch (e) { /* red caída momentáneamente: reintenta en el siguiente tick */ }
                }, POLL_INTERVAL_MS);
            });
        }

        function sendVibrate(uid, level) {
            return fetch(`/api/lovense/vibrate?uid=${encodeURIComponent(uid)}&level=${level}`, { method: 'POST' });
        }

        async function connect(onQrReady) {
            const { uid, qr } = await requestQR();
            if (!qr) throw new Error('Lovense no devolvió un código QR.');
            onQrReady(qr);

            await pollStatus(uid); // solo confirma que ya se emparejó; los comandos van por nuestro servidor
            currentUid = uid;
            connected = true;
            statusListener('connected');
        }

        function disconnect() {
            detachFromAudio();
            clearInterval(pollTimer);
            if (connected && currentUid) {
                sendVibrate(currentUid, 0).catch(() => {}); // para el juguete al desconectar
            }
            connected = false;
            currentUid = null;
            levelListener(null);
        }

        function feed(dataArray) {
            if (!connected || !currentUid) return;
            const now = performance.now();
            if (now - lastSent < SEND_INTERVAL_MS) return;
            lastSent = now;

            let sum = 0;
            for (let i = 0; i < BASS_BINS; i++) sum += dataArray[i];
            const intensity = Math.min(1, (sum / (BASS_BINS * 255)) * 1.3);
            const level = Math.round(intensity * VIBRATE_MAX);

            levelListener(level);
            sendVibrate(currentUid, level).catch(() => { /* comando perdido: no pasa nada, va el siguiente */ });
        }

        function attachToAudio() {
            if (unsubscribeAudio) return;
            unsubscribeAudio = AudioEngine.subscribe(feed);
        }

        function detachFromAudio() {
            if (unsubscribeAudio) {
                unsubscribeAudio();
                unsubscribeAudio = null;
            }
        }

        function sendStop() {
            if (!connected || !currentUid) return;
            lastSent = performance.now(); // evita que el próximo golpe de graves lo pise enseguida
            levelListener(0);
            sendVibrate(currentUid, 0).catch(() => {});
        }

        function setStatusListener(fn) { statusListener = fn; }
        function setLevelListener(fn) { levelListener = fn; }

        return {
            connect,
            disconnect,
            attachToAudio,
            sendStop,
            setStatusListener,
            setLevelListener,
            get connected() { return connected; },
        };
    })();

    let songs = [];
    let currentIndex = 0;
    let isDragging = false;

    const audioElement = document.getElementById('audio-element');
    const playlistElement = document.getElementById('playlist');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volume-slider');
    const muteBtn = document.getElementById('mute-btn');
    const volumeIcon = document.getElementById('volume-icon');
    const songTitleEl = document.getElementById('song-title');
    const songArtistEl = document.getElementById('song-artist');
    const albumArtImg = document.getElementById('album-art');
    const artPlaceholder = document.getElementById('art-placeholder');
    const artContainer = document.getElementById('art-container');
    const ringCanvas = document.getElementById('ring-canvas');
    const ringCtx = ringCanvas.getContext('2d');
    const toySwitch = document.getElementById('toy-switch');
    const toyHelp = document.getElementById('toy-help');
    const toyNote = document.getElementById('toy-note');
    const toyLevel = document.getElementById('toy-level');

    let previousVolume = 1;
    let toySyncEnabled = false;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    async function loadSongs() {
        try {
            const response = await fetch('/songs');
            if (!response.ok) throw new Error("Error en el servidor HTTP: " + response.status);

            songs = await response.json();
            renderPlaylist();

            if (songs.length > 0) {
                prepareSong(0);
            } else {
                songTitleEl.innerText = "La nube está vacía";
            }
        } catch (error) {
            console.error("Error al cargar las canciones:", error);
            songTitleEl.innerText = "Error conectando con la nube";
        }
    }

    function renderPlaylist() {
        playlistElement.innerHTML = '';
        songs.forEach((song, index) => {
            const li = document.createElement('li');
            const num = String(index + 1).padStart(2, '0');
            li.innerHTML = `<span class="track-num">${num}</span><span class="track-name">${song.titulo}</span>`;
            li.onclick = () => playSong(index);
            playlistElement.appendChild(li);
        });
        updateActiveItem();
    }

    function updateActiveItem() {
        const items = playlistElement.querySelectorAll('li');
        items.forEach((item, index) => {
            item.classList.toggle('active', index === currentIndex);
        });
    }

    function prepareSong(index) {
        currentIndex = index;
        const song = songs[index];

        songTitleEl.innerText = song.titulo;
        songArtistEl.innerText = song.artista;

        if (song.titulo.length > 28) {
            songTitleEl.classList.add('marquee');
        } else {
            songTitleEl.classList.remove('marquee');
        }

        audioElement.src = `/play?song=${encodeURIComponent(song.nombre)}`;
        updateActiveItem();

        albumArtImg.style.display = 'none';
        artPlaceholder.style.display = 'block';
        albumArtImg.src = `/cover?song=${encodeURIComponent(song.nombre)}`;

        albumArtImg.onload = () => {
            albumArtImg.style.display = 'block';
            artPlaceholder.style.display = 'none';
        };
        albumArtImg.onerror = () => {
            albumArtImg.style.display = 'none';
            artPlaceholder.style.display = 'block';
        };
    }

    function playSong(index) {
        prepareSong(index);
        AudioEngine.ensureContext(audioElement);
        AudioEngine.resume();
        audioElement.play().then(() => {
            playIcon.className = "fa-solid fa-pause";
        }).catch(err => console.error("Error al reproducir:", err));
    }

    playBtn.onclick = () => {
        if (songs.length === 0) return;
        AudioEngine.ensureContext(audioElement);
        AudioEngine.resume();
        if (audioElement.paused) {
            if (!audioElement.src || audioElement.src === "") prepareSong(currentIndex);
            audioElement.play().then(() => {
                playIcon.className = "fa-solid fa-pause";
            }).catch(err => console.error(err));
        } else {
            audioElement.pause();
            playIcon.className = "fa-solid fa-play";
        }
    };

    nextBtn.onclick = () => { if (songs.length > 0) playSong((currentIndex + 1) % songs.length); };
    prevBtn.onclick = () => { if (songs.length > 0) playSong((currentIndex - 1 + songs.length) % songs.length); };

    audioElement.ontimeupdate = () => {
        if (!isDragging && audioElement.duration) {
            const percent = (audioElement.currentTime / audioElement.duration) * 100;
            progressBar.style.width = `${percent}%`;
            currentTimeEl.innerText = formatTime(audioElement.currentTime);
            durationEl.innerText = formatTime(audioElement.duration);
        }
    };

    function getSeekTime(e) {
        const rect = progressContainer.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        let clickX = clientX - rect.left;
        if (clickX < 0) clickX = 0;
        if (clickX > rect.width) clickX = rect.width;
        const percentage = clickX / rect.width;
        return { percentage, time: percentage * audioElement.duration };
    }

    progressContainer.onmousedown = (e) => {
        if (!audioElement.duration) return;
        isDragging = true;
        progressContainer.classList.add('dragging');
        const { percentage, time } = getSeekTime(e);
        progressBar.style.width = `${percentage * 100}%`;
        currentTimeEl.innerText = formatTime(time);
    };

    window.onmousemove = (e) => {
        if (!isDragging || !audioElement.duration) return;
        const { percentage, time } = getSeekTime(e);
        progressBar.style.width = `${percentage * 100}%`;
        currentTimeEl.innerText = formatTime(time);
    };

    window.onmouseup = (e) => {
        if (!isDragging || !audioElement.duration) return;
        isDragging = false;
        progressContainer.classList.remove('dragging');
        const { time } = getSeekTime(e);
        audioElement.currentTime = time;
    };

    progressContainer.ontouchstart = (e) => {
        if (!audioElement.duration) return;
        isDragging = true;
        progressContainer.classList.add('dragging');
        const { percentage, time } = getSeekTime(e);
        progressBar.style.width = `${percentage * 100}%`;
        currentTimeEl.innerText = formatTime(time);
    };

    window.ontouchmove = (e) => {
        if (!isDragging || !audioElement.duration) return;
        const { percentage, time } = getSeekTime(e);
        progressBar.style.width = `${percentage * 100}%`;
        currentTimeEl.innerText = formatTime(time);
    };

    window.ontouchend = (e) => {
        if (!isDragging || !audioElement.duration) return;
        isDragging = false;
        progressContainer.classList.remove('dragging');
        const touch = e.changedTouches && e.changedTouches[0];
        if (touch) {
            const rect = progressContainer.getBoundingClientRect();
            let clickX = touch.clientX - rect.left;
            if (clickX < 0) clickX = 0;
            if (clickX > rect.width) clickX = rect.width;
            const percentage = clickX / rect.width;
            audioElement.currentTime = percentage * audioElement.duration;
        }
    };

    audioElement.onended = () => nextBtn.click();

    // Al pausar, limpiamos el visualizador y paramos el juguete de inmediato
    // en vez de dejar que se queden con el último valor "congelado".
    audioElement.addEventListener('pause', () => {
        drawRing(null);
        artContainer.style.boxShadow = '0 0 0 1px var(--border), 0 20px 45px rgba(0,0,0,0.55)';
        if (ToySync.connected) {
            ToySync.sendStop();
        }
    });

    volumeSlider.oninput = (e) => {
        audioElement.volume = e.target.value;
        updateVolumeIcon(e.target.value);
    };

    muteBtn.onclick = () => {
        if (audioElement.volume > 0) {
            previousVolume = audioElement.volume;
            audioElement.volume = 0;
            volumeSlider.value = 0;
            volumeIcon.className = "fa-solid fa-volume-xmark";
        } else {
            audioElement.volume = previousVolume;
            volumeSlider.value = previousVolume;
            updateVolumeIcon(previousVolume);
        }
    };

    function updateVolumeIcon(vol) {
        if (vol == 0) volumeIcon.className = "fa-solid fa-volume-xmark";
        else if (vol < 0.5) volumeIcon.className = "fa-solid fa-volume-low";
        else volumeIcon.className = "fa-solid fa-volume-high";
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // ---------------------------------------------------------------
    // Interruptor de "Sincronizar juguete": genera el QR de Lovense,
    // espera a que lo escanees, y a partir de ahí manda comandos de
    // vibración directo a tu app (sin pasar por Render en cada golpe).
    // ---------------------------------------------------------------
    const LOVENSE_HELP_HTML =
        'Para sincronizar tu juguete <strong>Lovense</strong> al ritmo de la música:<br><br>' +
        '1. Pulsa el interruptor de al lado — aparecerá un código QR aquí mismo.<br>' +
        '2. Escanéalo con la app <strong>Lovense Remote</strong> (la misma que ya usas para el juguete).<br>' +
        '3. Confirma en la app. En cuanto conecte, empieza a vibrar con los graves de la sesión.<br><br>' +
        'No hace falta instalar nada más — todo pasa por tu propia cuenta de Lovense.';

    let toyNoteMode = null; // 'help' | null — para saber si el panel de ayuda está fijo o es un mensaje de estado

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    function showToyNote(html, autoHideMs) {
        toyNoteMode = null;
        toyNote.innerHTML = html;
        toyNote.classList.add('visible');
        clearTimeout(toyNote._hideTimer);
        if (autoHideMs) {
            toyNote._hideTimer = setTimeout(() => toyNote.classList.remove('visible'), autoHideMs);
        }
    }

    toyHelp.onclick = () => {
        clearTimeout(toyNote._hideTimer);
        if (toyNote.classList.contains('visible') && toyNoteMode === 'help') {
            toyNote.classList.remove('visible');
            toyNoteMode = null;
            return;
        }
        toyNoteMode = 'help';
        toyNote.innerHTML = LOVENSE_HELP_HTML;
        toyNote.classList.add('visible');
    };

    ToySync.setStatusListener((status) => {
        if (status === 'connected') {
            showToyNote('¡Conectado! Ya vibra al ritmo de los graves de la sesión.', 6000);
        }
    });

    ToySync.setLevelListener((level) => {
        if (level === null) {
            toyLevel.classList.remove('visible');
            return;
        }
        toyLevel.textContent = `${level}/20`;
        toyLevel.classList.add('visible');
    });

    toySwitch.onclick = async () => {
        if (toySwitch.disabled) return;

        if (toySyncEnabled) {
            toySwitch.disabled = true;
            ToySync.disconnect();
            toySyncEnabled = false;
            toySwitch.classList.remove('on');
            toySwitch.setAttribute('aria-checked', 'false');
            toySwitch.disabled = false;
            showToyNote('Desconectado.', 3000);
            return;
        }

        toySwitch.disabled = true;
        try {
            await ToySync.connect((qrUrl) => {
                showToyNote(
                    `Escanea este código con la app <strong>Lovense Remote</strong>:<br>` +
                    `<img src="${escapeHtml(qrUrl)}" alt="Código QR de Lovense" style="width:150px;height:150px;margin-top:8px;border-radius:8px;display:block;">`
                );
            });
            ToySync.attachToAudio();
            toySyncEnabled = true;
            toySwitch.classList.add('on');
            toySwitch.setAttribute('aria-checked', 'true');
            showToyNote('¡Conectado! Ya vibra al ritmo de los graves de la sesión.', 6000);
        } catch (err) {
            console.error('ToySync:', err);
            const detail = (err && err.message) ? err.message : String(err);
            showToyNote(`No se pudo conectar con Lovense.<br><span style="opacity:.65">${escapeHtml(detail)}</span>`);
        } finally {
            toySwitch.disabled = false;
        }
    };

    // ---------------------------------------------------------------
    // Visualizador en anillo: barras radiales alrededor de la carátula,
    // impulsadas por el mismo AnalyserNode del AudioEngine.
    // ---------------------------------------------------------------
    function drawRing(dataArray) {
        const w = ringCanvas.width, h = ringCanvas.height;
        ringCtx.clearRect(0, 0, w, h);
        if (!dataArray || prefersReducedMotion) return;

        const cx = w / 2, cy = h / 2;
        const baseRadius = 112;
        const barCount = 56;
        const step = Math.floor(dataArray.length / barCount) || 1;

        for (let i = 0; i < barCount; i++) {
            const value = dataArray[i * step] / 255;
            const angle = (i / barCount) * Math.PI * 2 - Math.PI / 2;
            const barLength = 4 + value * 40;
            const x1 = cx + Math.cos(angle) * baseRadius;
            const y1 = cy + Math.sin(angle) * baseRadius;
            const x2 = cx + Math.cos(angle) * (baseRadius + barLength);
            const y2 = cy + Math.sin(angle) * (baseRadius + barLength);

            ringCtx.strokeStyle = value > 0.6
                ? `rgba(0, 224, 255, ${0.5 + value * 0.5})`
                : `rgba(255, 46, 136, ${0.35 + value * 0.5})`;
            ringCtx.lineWidth = 3;
            ringCtx.lineCap = 'round';
            ringCtx.beginPath();
            ringCtx.moveTo(x1, y1);
            ringCtx.lineTo(x2, y2);
            ringCtx.stroke();
        }

        // Brillo suave en la carátula acorde a la energía de graves
        let bassSum = 0;
        for (let i = 0; i < 6; i++) bassSum += dataArray[i];
        const bass = bassSum / (6 * 255);
        artContainer.style.boxShadow =
            `0 0 0 1px var(--border), 0 20px 45px rgba(0,0,0,0.55), 0 0 ${18 + bass * 40}px rgba(255, 46, 136, ${0.15 + bass * 0.35})`;
    }

    AudioEngine.subscribe(drawRing);

    loadSongs();
</script>
</body>
</html>
