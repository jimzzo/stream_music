<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor de Sesiones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
    :root {
        --bg: #0a0710;
        --bg-2: #150a20;
        --surface: rgba(26, 15, 38, 0.55);
        --surface-strong: rgba(26, 15, 38, 0.82);
        --border: rgba(255, 255, 255, 0.08);
        --accent: #ff2e88;
        --accent-2: #7c3aed;
        --accent-cyan: #00e0ff;
        --warm: #ffb74a;
        --text: #f5eefb;
        --text-secondary: #9c8fb5;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
    }

    html, body {
        background-color: var(--bg);
        color: var(--text);
    }

    body {
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* ---------- Sidebar / tracklist ---------- */

    .sidebar {
        width: 320px;
        background-color: rgba(6, 3, 10, 0.9);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        z-index: 2;
    }

    .sidebar-header {
        padding: 26px 22px 18px 22px;
        border-bottom: 1px solid var(--border);
    }

    .sidebar-header .kicker {
        font-size: 0.72rem;
        color: var(--text-secondary);
        letter-spacing: 0.02em;
    }

    .sidebar-header h1 {
        font-family: "Unbounded", "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        margin-top: 4px;
        line-height: 1.3;
    }

    .tracklist {
        list-style: none;
        overflow-y: auto;
        flex: 1;
        padding: 8px 10px;
    }

    .tracklist::-webkit-scrollbar {
        width: 6px;
    }
    .tracklist::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
    }

    .tracklist li {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 12px;
        margin-bottom: 2px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--text-secondary);
        font-size: 0.9rem;
        transition: background 0.15s, color 0.15s;
    }

    .tracklist li:hover {
        background-color: rgba(255, 255, 255, 0.05);
        color: var(--text);
    }

    .tracklist li.active {
        background: linear-gradient(90deg, rgba(255, 46, 136, 0.18), rgba(124, 58, 237, 0.1));
        color: var(--text);
    }

    .track-num {
        font-variant-numeric: tabular-nums;
        font-size: 0.78rem;
        color: var(--text-secondary);
        width: 20px;
        flex-shrink: 0;
    }

    .tracklist li.active .track-num {
        color: var(--accent);
    }

    .track-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ---------- Main stage ---------- */

    .main-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        position: relative;
        overflow: hidden;
    }

    .ambient-bg {
        position: absolute;
        inset: -20%;
        background:
            radial-gradient(circle at 30% 25%, rgba(255, 46, 136, 0.22), transparent 45%),
            radial-gradient(circle at 75% 70%, rgba(124, 58, 237, 0.24), transparent 50%),
            radial-gradient(circle at 50% 100%, rgba(0, 224, 255, 0.08), transparent 55%);
        filter: blur(70px);
        z-index: 0;
        animation: driftGlow 14s ease-in-out infinite alternate;
        pointer-events: none;
    }

    @keyframes driftGlow {
        0%   { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.15) translate(3%, -3%); }
    }

    @media (prefers-reduced-motion: reduce) {
        .ambient-bg { animation: none; }
    }

    .stage {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 460px;
        text-align: center;
    }

    /* ---------- Art + visualizer ring ---------- */

    .art-stage {
        position: relative;
        width: 260px;
        height: 260px;
        margin: 0 auto 28px auto;
    }

    #ring-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .album-art-container {
        position: absolute;
        top: 25px;
        left: 25px;
        width: 210px;
        height: 210px;
        border-radius: 18px;
        overflow: hidden;
        background-color: #161022;
        box-shadow: 0 0 0 1px var(--border), 0 20px 45px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: box-shadow 0.2s;
    }

    .album-art-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: none;
    }

    .album-art-placeholder {
        font-size: 3.6rem;
        color: var(--text-secondary);
    }

    /* ---------- Song info ---------- */

    .song-info {
        margin-bottom: 26px;
        overflow: hidden;
    }

    .marquee-container {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
    }

    .song-title {
        font-family: "Unbounded", "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        display: inline-block;
    }

    .song-title.marquee {
        padding-left: 100%;
        animation: marqueeAnim 13s linear infinite;
    }

    @keyframes marqueeAnim {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-100%, 0); }
    }

    .song-artist {
        color: var(--text-secondary);
        font-size: 0.92rem;
        margin-top: 6px;
    }

    /* ---------- Progress ---------- */

    .progress-container {
        width: 100%;
        background-color: rgba(255, 255, 255, 0.08);
        height: 6px;
        border-radius: 3px;
        cursor: pointer;
        margin-bottom: 8px;
        position: relative;
        overflow: visible;
        transition: height 0.15s;
    }

    .progress-container:hover {
        height: 8px;
    }

    .progress-bar {
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        height: 100%;
        width: 0%;
        border-radius: 3px;
        position: relative;
    }

    .progress-bar::after {
        content: '';
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%) scale(0);
        width: 12px;
        height: 12px;
        background-color: #fff;
        border-radius: 50%;
        transition: transform 0.15s;
        box-shadow: 0 0 8px rgba(255, 46, 136, 0.7);
    }

    .progress-container:hover .progress-bar::after,
    .progress-container.dragging .progress-bar::after {
        transform: translateY(-50%) scale(1);
    }

    .time-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.74rem;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        margin-bottom: 26px;
    }

    /* ---------- Controls ---------- */

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 28px;
        margin-bottom: 26px;
    }

    .btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 1.3rem;
        transition: color 0.15s, transform 0.15s;
    }

    .btn:hover {
        color: var(--text);
        transform: scale(1.1);
    }

    .btn:focus-visible, button:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent-cyan);
        outline-offset: 3px;
    }

    .btn-play {
        background: var(--warm);
        color: #1a0f00;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        box-shadow: 0 8px 24px rgba(255, 183, 74, 0.35);
        transition: transform 0.15s, box-shadow 0.15s;
        cursor: pointer;
        border: none;
    }

    .btn-play:hover {
        transform: scale(1.06);
        box-shadow: 0 10px 30px rgba(255, 183, 74, 0.5);
    }

    /* ---------- Footer row: volumen + sync juguete ---------- */

    .footer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .volume-container {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .volume-container .btn {
        font-size: 1rem;
    }

    .volume-slider {
        width: 80px;
        height: 4px;
        accent-color: var(--accent);
        cursor: pointer;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
    }

    .toy-sync {
        display: flex;
        align-items: center;
        gap: 9px;
        position: relative;
    }

    .toy-sync-label {
        font-size: 0.78rem;
        color: var(--text-secondary);
        white-space: nowrap;
    }

    .toy-switch {
        width: 38px;
        height: 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid var(--border);
        cursor: pointer;
        position: relative;
        transition: background 0.2s;
        flex-shrink: 0;
    }

    .toy-switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--text-secondary);
        transition: transform 0.2s, background 0.2s;
    }

    .toy-switch.on {
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        border-color: transparent;
    }

    .toy-switch.on::after {
        transform: translateX(16px);
        background: #fff;
    }

    .toy-switch:disabled {
        opacity: 0.55;
        cursor: wait;
    }

    .toy-help-btn {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 0.68rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: color 0.15s, background 0.15s;
    }

    .toy-help-btn:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.15);
    }

    .toy-note a {
        color: var(--accent-cyan);
        text-decoration: underline;
    }

    .toy-note {
        position: absolute;
        bottom: calc(100% + 10px);
        right: 0;
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.76rem;
        color: var(--text-secondary);
        width: 210px;
        text-align: left;
        line-height: 1.4;
        display: none;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .toy-note.visible {
        display: block;
    }

    @media (max-width: 768px) {
        body {
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar {
            width: 100%;
            max-height: 170px;
            border-right: none;
            border-bottom: 1px solid var(--border);
        }
        .main-container {
            flex: 1;
            padding: 24px 20px;
            justify-content: flex-start;
        }
    }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="kicker">Cloudflare R2</div>
        <h1>Tus sesiones</h1>
    </div>
    <ul id="playlist" class="tracklist"></ul>
</div>

<div class="main-container">
    <div class="ambient-bg"></div>

    <div class="stage">

        <div class="art-stage">
            <canvas id="ring-canvas" width="260" height="260"></canvas>
            <div id="art-container" class="album-art-container">
                <i id="art-placeholder" class="fa-solid fa-compact-disc album-art-placeholder"></i>
                <img id="album-art" alt="Carátula">
            </div>
        </div>

        <div class="song-info">
            <div class="marquee-container">
                <div id="song-title" class="song-title">Cargando música...</div>
            </div>
            <div id="song-artist" class="song-artist">&nbsp;</div>
        </div>

        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="time-info">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="prev-btn" class="btn" title="Anterior"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play-btn" class="btn-play" title="Reproducir/Pausar"><i class="fa-solid fa-play" id="play-icon"></i></button>
            <button id="next-btn" class="btn" title="Siguiente"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <div class="footer-row">
            <div class="volume-container">
                <button id="mute-btn" class="btn" title="Silenciar"><i class="fa-solid fa-volume-high" id="volume-icon"></i></button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>

            <div class="toy-sync">
                <span class="toy-sync-label">Sincronizar juguete</span>
                <button id="toy-help" class="toy-help-btn" type="button" title="¿Qué necesito para esto?" aria-label="Ayuda sobre sincronizar juguete">?</button>
                <button id="toy-switch" class="toy-switch" role="switch" aria-checked="false" title="Sincronizar juguete al ritmo"></button>
                <div id="toy-note" class="toy-note">Necesita Intiface Central abierto en este dispositivo, con el servidor iniciado (puerto 12345). Nada de esto pasa por nuestro servidor: la conexión es directa entre esta página y tu Intiface Central.</div>
            </div>
        </div>

    </div>
</div>

<audio id="audio-element"></audio>

<script>
    // ---------------------------------------------------------------
    // Motor de audio compartido: un único AnalyserNode que alimenta
    // tanto el visualizador en anillo como (más adelante) la
    // sincronización del juguete. Cualquier otra parte de la interfaz
    // puede suscribirse con AudioEngine.subscribe(fn) sin duplicar el
    // grafo de Web Audio.
    // ---------------------------------------------------------------
    const AudioEngine = (() => {
        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let listeners = [];
        let rafId = null;

        function ensureContext(audioElement) {
            if (audioCtx) return;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return; // navegador sin Web Audio: la interfaz sigue funcionando sin visualizador
            audioCtx = new Ctx();
            const source = audioCtx.createMediaElementSource(audioElement);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.75;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            loop();
        }

        function resume() {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function loop() {
            rafId = requestAnimationFrame(loop);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            listeners.forEach(fn => fn(dataArray));
        }

        function subscribe(fn) {
            listeners.push(fn);
            return () => { listeners = listeners.filter(l => l !== fn); };
        }

        return { ensureContext, resume, subscribe };
    })();

    // ---------------------------------------------------------------
    // ToySync: conecta a Intiface Central (https://intiface.com/central)
    // corriendo en el MISMO dispositivo que el navegador, vía WebSocket
    // local (ws://127.0.0.1:12345 por defecto). Nada de esto toca el
    // servidor del reproductor — es una conexión 100% local del usuario
    // a su propia app. Usa la librería oficial "buttplug" (buttplug.io),
    // cargada solo si el usuario activa el interruptor.
    // ---------------------------------------------------------------
    const ToySync = (() => {
        const LIBRARY_URL = 'https://cdn.jsdelivr.net/npm/buttplug@5/dist/web/buttplug.js';
        const SEND_INTERVAL_MS = 100; // máx. ~10 comandos/seg, para no saturar el Bluetooth
        const BASS_BINS = 8;          // graves = primeros bins del análisis de frecuencia

        let client = null;
        let devices = [];
        let unsubscribeAudio = null;
        let lastSent = 0;
        let statusListener = () => {};

        function loadLibrary() {
            return new Promise((resolve, reject) => {
                if (window.Buttplug) return resolve();
                const script = document.createElement('script');
                script.src = LIBRARY_URL;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('No se pudo cargar la librería de control (revisa tu conexión).'));
                document.head.appendChild(script);
            });
        }

        async function connect(address) {
            await loadLibrary();

            const connector = new Buttplug.ButtplugBrowserWebsocketClientConnector(address);
            client = new Buttplug.ButtplugClient('Reproductor de sesiones');

            client.addListener('disconnect', () => {
                devices = [];
                client = null;
                statusListener('disconnected');
            });
            client.addListener('deviceadded', (device) => {
                devices.push(device);
                statusListener('device-added', device.name);
            });
            client.addListener('deviceremoved', (device) => {
                devices = devices.filter(d => d !== device);
                statusListener('device-removed', device.name);
            });

            await client.connect(connector);
            await client.startScanning();
            statusListener('connected');
        }

        async function stopAll() {
            for (const d of devices) {
                try { await d.stop(); } catch (e) { /* el juguete ya pudo desconectarse */ }
            }
        }

        async function disconnect() {
            detachFromAudio();
            if (client) {
                try {
                    await stopAll();
                    await client.disconnect();
                } catch (e) { /* puede que ya estuviera desconectado */ }
            }
            client = null;
            devices = [];
        }

        function feed(dataArray) {
            if (!client || devices.length === 0) return;
            const now = performance.now();
            if (now - lastSent < SEND_INTERVAL_MS) return;
            lastSent = now;

            let sum = 0;
            for (let i = 0; i < BASS_BINS; i++) sum += dataArray[i];
            const intensity = Math.min(1, (sum / (BASS_BINS * 255)) * 1.3);

            devices.forEach(d => {
                d.vibrate(intensity).catch(() => { /* comando perdido: no pasa nada, va el siguiente */ });
            });
        }

        function attachToAudio() {
            if (unsubscribeAudio) return;
            unsubscribeAudio = AudioEngine.subscribe(feed);
        }

        function detachFromAudio() {
            if (unsubscribeAudio) {
                unsubscribeAudio();
                unsubscribeAudio = null;
            }
        }

        function setStatusListener(fn) { statusListener = fn; }

        return {
            connect,
            disconnect,
            attachToAudio,
            setStatusListener,
            get deviceCount() { return devices.length; },
        };
    })();

    let songs = [];
    let currentIndex = 0;
    let isDragging = false;

    const audioElement = document.getElementById('audio-element');
    const playlistElement = document.getElementById('playlist');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volume-slider');
    const muteBtn = document.getElementById('mute-btn');
    const volumeIcon = document.getElementById('volume-icon');
    const songTitleEl = document.getElementById('song-title');
    const songArtistEl = document.getElementById('song-artist');
    const albumArtImg = document.getElementById('album-art');
    const artPlaceholder = document.getElementById('art-placeholder');
    const artContainer = document.getElementById('art-container');
    const ringCanvas = document.getElementById('ring-canvas');
    const ringCtx = ringCanvas.getContext('2d');
    const toySwitch = document.getElementById('toy-switch');
    const toyHelp = document.getElementById('toy-help');
    const toyNote = document.getElementById('toy-note');

    let previousVolume = 1;
    let toySyncEnabled = false;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    async function loadSongs() {
        try {
            const response = await fetch('/songs');
            if (!response.ok) throw new Error("Error en el servidor HTTP: " + response.status);

            songs = await response.json();
            renderPlaylist();

            if (songs.length > 0) {
                prepareSong(0);
            } else {
                songTitleEl.innerText = "La nube está vacía";
            }
        } catch (error) {
            console.error("Error al cargar las canciones:", error);
            songTitleEl.innerText = "Error conectando con la nube";
        }
    }

    function renderPlaylist() {
        playlistElement.innerHTML = '';
        songs.forEach((song, index) => {
            const li = document.createElement('li');
            const num = String(index + 1).padStart(2, '0');
            li.innerHTML = `<span class="track-num">${num}</span><span class="track-name">${song.titulo}</span>`;
            li.onclick = () => playSong(index);
            playlistElement.appendChild(li);
        });
        updateActiveItem();
    }

    function updateActiveItem() {
        const items = playlistElement.querySelectorAll('li');
        items.forEach((item, index) => {
            item.classList.toggle('active', index === currentIndex);
        });
    }

    function prepareSong(index) {
        currentIndex = index;
        const song = songs[index];

        songTitleEl.innerText = song.titulo;
        songArtistEl.innerText = song.artista;

        if (song.titulo.length > 28) {
            songTitleEl.classList.add('marquee');
        } else {
            songTitleEl.classList.remove('marquee');
        }

        audioElement.src = `/play?song=${encodeURIComponent(song.nombre)}`;
        updateActiveItem();

        albumArtImg.style.display = 'none';
        artPlaceholder.style.display = 'block';
        albumArtImg.src = `/cover?song=${encodeURIComponent(song.nombre)}`;

        albumArtImg.onload = () => {
            albumArtImg.style.display = 'block';
            artPlaceholder.style.display = 'none';
        };
        albumArtImg.onerror = () => {
            albumArtImg.style.display = 'none';
            artPlaceholder.style.display = 'block';
        };
    }

    function playSong(index) {
        prepareSong(index);
        AudioEngine.ensureContext(audioElement);
        AudioEngine.resume();
        audioElement.play().then(() => {
            playIcon.className = "fa-solid fa-pause";
        }).catch(err => console.error("Error al reproducir:", err));
    }

    playBtn.onclick = () => {
        if (songs.length === 0) return;
        AudioEngine.ensureContext(audioElement);
        AudioEngine.resume();
        if (audioElement.paused) {
            if (!audioElement.src || audioElement.src === "") prepareSong(currentIndex);
            audioElement.play().then(() => {
                playIcon.className = "fa-solid fa-pause";
            }).catch(err => console.error(err));
        } else {
            audioElement.pause();
            playIcon.className = "fa-solid fa-play";
        }
    };

    nextBtn.onclick = () => { if (songs.length > 0) playSong((currentIndex + 1) % songs.length); };
    prevBtn.onclick = () => { if (songs.length > 0) playSong((currentIndex - 1 + songs.length) % songs.length); };

    audioElement.ontimeupdate = () => {
        if (!isDragging && audioElement.duration) {
            const percent = (audioElement.currentTime / audioElement.duration) * 100;
            progressBar.style.width = `${percent}%`;
            currentTimeEl.innerText = formatTime(audioElement.currentTime);
            durationEl.innerText = formatTime(audioElement.duration);
        }
    };

    function getSeekTime(e) {
        const rect = progressContainer.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        let clickX = clientX - rect.left;
        if (clickX < 0) clickX = 0;
        if (clickX > rect.width) clickX = rect.width;
        const percentage = clickX / rect.width;
        return { percentage, time: percentage * audioElement.duration };
    }

    progressContainer.onmousedown = (e) => {
        if (!audioElement.duration) return;
        isDragging = true;
        progressContainer.classList.add('dragging');
        const { percentage, time } = getSeekTime(e);
        progressBar.style.width = `${percentage * 100}%`;
        currentTimeEl.innerText = formatTime(time);
    };

    window.onmousemove = (e) => {
        if (!isDragging || !audioElement.duration) return;
        const { percentage, time } = getSeekTime(e);
        progressBar.style.width = `${percentage * 100}%`;
        currentTimeEl.innerText = formatTime(time);
    };

    window.onmouseup = (e) => {
        if (!isDragging || !audioElement.duration) return;
        isDragging = false;
        progressContainer.classList.remove('dragging');
        const { time } = getSeekTime(e);
        audioElement.currentTime = time;
    };

    progressContainer.ontouchstart = (e) => {
        if (!audioElement.duration) return;
        isDragging = true;
        progressContainer.classList.add('dragging');
        const { percentage, time } = getSeekTime(e);
        progressBar.style.width = `${percentage * 100}%`;
        currentTimeEl.innerText = formatTime(time);
    };

    window.ontouchmove = (e) => {
        if (!isDragging || !audioElement.duration) return;
        const { percentage, time } = getSeekTime(e);
        progressBar.style.width = `${percentage * 100}%`;
        currentTimeEl.innerText = formatTime(time);
    };

    window.ontouchend = (e) => {
        if (!isDragging || !audioElement.duration) return;
        isDragging = false;
        progressContainer.classList.remove('dragging');
        const touch = e.changedTouches && e.changedTouches[0];
        if (touch) {
            const rect = progressContainer.getBoundingClientRect();
            let clickX = touch.clientX - rect.left;
            if (clickX < 0) clickX = 0;
            if (clickX > rect.width) clickX = rect.width;
            const percentage = clickX / rect.width;
            audioElement.currentTime = percentage * audioElement.duration;
        }
    };

    audioElement.onended = () => nextBtn.click();

    volumeSlider.oninput = (e) => {
        audioElement.volume = e.target.value;
        updateVolumeIcon(e.target.value);
    };

    muteBtn.onclick = () => {
        if (audioElement.volume > 0) {
            previousVolume = audioElement.volume;
            audioElement.volume = 0;
            volumeSlider.value = 0;
            volumeIcon.className = "fa-solid fa-volume-xmark";
        } else {
            audioElement.volume = previousVolume;
            volumeSlider.value = previousVolume;
            updateVolumeIcon(previousVolume);
        }
    };

    function updateVolumeIcon(vol) {
        if (vol == 0) volumeIcon.className = "fa-solid fa-volume-xmark";
        else if (vol < 0.5) volumeIcon.className = "fa-solid fa-volume-low";
        else volumeIcon.className = "fa-solid fa-volume-high";
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // ---------------------------------------------------------------
    // Interruptor de "Sincronizar juguete": conecta/desconecta de
    // verdad contra Intiface Central corriendo en este dispositivo.
    // ---------------------------------------------------------------
    const INTIFACE_ADDRESS = 'ws://127.0.0.1:12345';
    const INTIFACE_HELP_HTML =
        'Para que el juguete vibre con la música necesitas <strong>Intiface Central</strong>, una app gratuita (de intiface.com, no nuestra) que hace de puente entre el Bluetooth del juguete y esta página.<br><br>' +
        '1. <a href="https://intiface.com/central" target="_blank" rel="noopener">Descárgala aquí</a> e instálala en este mismo dispositivo.<br>' +
        '2. Ábrela y pulsa "Start Server".<br>' +
        '3. Enciende el juguete y activa el interruptor de al lado.';

    let toyNoteMode = null; // 'help' | null — para saber si el panel de ayuda está fijo o es un mensaje de estado

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    function showToyNote(html, autoHideMs) {
        toyNoteMode = null;
        toyNote.innerHTML = html;
        toyNote.classList.add('visible');
        clearTimeout(toyNote._hideTimer);
        if (autoHideMs) {
            toyNote._hideTimer = setTimeout(() => toyNote.classList.remove('visible'), autoHideMs);
        }
    }

    toyHelp.onclick = () => {
        clearTimeout(toyNote._hideTimer);
        if (toyNote.classList.contains('visible') && toyNoteMode === 'help') {
            toyNote.classList.remove('visible');
            toyNoteMode = null;
            return;
        }
        toyNoteMode = 'help';
        toyNote.innerHTML = INTIFACE_HELP_HTML;
        toyNote.classList.add('visible');
    };

    ToySync.setStatusListener((status, detail) => {
        if (status === 'connected') {
            showToyNote('Conectado a Intiface Central. Buscando juguetes por Bluetooth…', 5000);
        } else if (status === 'device-added') {
            showToyNote(`Detectado: ${escapeHtml(detail)}. Ya vibra al ritmo de los graves.`, 5000);
        } else if (status === 'device-removed') {
            showToyNote(`Se desconectó: ${escapeHtml(detail)}.`, 5000);
        } else if (status === 'disconnected') {
            toySyncEnabled = false;
            toySwitch.classList.remove('on');
            toySwitch.setAttribute('aria-checked', 'false');
            showToyNote('Desconectado de Intiface Central.', 4000);
        }
    });

    toySwitch.onclick = async () => {
        if (toySwitch.disabled) return;

        if (toySyncEnabled) {
            toySwitch.disabled = true;
            await ToySync.disconnect();
            toySyncEnabled = false;
            toySwitch.classList.remove('on');
            toySwitch.setAttribute('aria-checked', 'false');
            toySwitch.disabled = false;
            showToyNote('Desconectado.', 3000);
            return;
        }

        toySwitch.disabled = true;
        showToyNote('Conectando con Intiface Central…');
        try {
            await ToySync.connect(INTIFACE_ADDRESS);
            ToySync.attachToAudio();
            toySyncEnabled = true;
            toySwitch.classList.add('on');
            toySwitch.setAttribute('aria-checked', 'true');
            showToyNote('Conectado. Buscando juguetes por Bluetooth…', 5000);
        } catch (err) {
            console.error('ToySync:', err);
            showToyNote(
                'No se encontró Intiface Central. <a href="https://intiface.com/central" target="_blank" rel="noopener">Descárgalo aquí</a> (gratis), ábrelo, pulsa "Start Server" y vuelve a intentar.'
            );
        } finally {
            toySwitch.disabled = false;
        }
    };

    // ---------------------------------------------------------------
    // Visualizador en anillo: barras radiales alrededor de la carátula,
    // impulsadas por el mismo AnalyserNode del AudioEngine.
    // ---------------------------------------------------------------
    function drawRing(dataArray) {
        const w = ringCanvas.width, h = ringCanvas.height;
        ringCtx.clearRect(0, 0, w, h);
        if (!dataArray || prefersReducedMotion) return;

        const cx = w / 2, cy = h / 2;
        const baseRadius = 112;
        const barCount = 56;
        const step = Math.floor(dataArray.length / barCount) || 1;

        for (let i = 0; i < barCount; i++) {
            const value = dataArray[i * step] / 255;
            const angle = (i / barCount) * Math.PI * 2 - Math.PI / 2;
            const barLength = 4 + value * 40;
            const x1 = cx + Math.cos(angle) * baseRadius;
            const y1 = cy + Math.sin(angle) * baseRadius;
            const x2 = cx + Math.cos(angle) * (baseRadius + barLength);
            const y2 = cy + Math.sin(angle) * (baseRadius + barLength);

            ringCtx.strokeStyle = value > 0.6
                ? `rgba(0, 224, 255, ${0.5 + value * 0.5})`
                : `rgba(255, 46, 136, ${0.35 + value * 0.5})`;
            ringCtx.lineWidth = 3;
            ringCtx.lineCap = 'round';
            ringCtx.beginPath();
            ringCtx.moveTo(x1, y1);
            ringCtx.lineTo(x2, y2);
            ringCtx.stroke();
        }

        // Brillo suave en la carátula acorde a la energía de graves
        let bassSum = 0;
        for (let i = 0; i < 6; i++) bassSum += dataArray[i];
        const bass = bassSum / (6 * 255);
        artContainer.style.boxShadow =
            `0 0 0 1px var(--border), 0 20px 45px rgba(0,0,0,0.55), 0 0 ${18 + bass * 40}px rgba(255, 46, 136, ${0.15 + bass * 0.35})`;
    }

    AudioEngine.subscribe(drawRing);

    loadSongs();
</script>
</body>
